name: signal_citizens
description: Сигнал — обращения жителей и ответы организаций.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  http_parser: ^4.1.2
  web: ^1.1.1
  cupertino_icons: ^1.0.8
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
