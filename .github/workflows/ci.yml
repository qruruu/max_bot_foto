name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: maxphotos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d maxphotos_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/maxphotos_test
      APP_ENV: test
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --project backend --frozen --python 3.12
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend pytest backend/tests --cov=app --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
