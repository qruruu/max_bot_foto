name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: maxphotos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d maxphotos_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/maxphotos_test
      APP_ENV: test
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set OCR model directory
        run: echo "OCR_MODEL_DIR=$RUNNER_TEMP/ocr-models" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --project backend --frozen --python 3.12
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend python backend/app/ocr_models.py "$OCR_MODEL_DIR"
      - run: uv run --project backend pytest backend/tests --cov=app --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  signal-flutter:
    runs-on: ubuntu-latest
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    defaults:
      run:
        working-directory: signal_flutter
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/browser/*.test.cjs
      - run: python3 tool/build.py
