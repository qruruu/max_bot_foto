limit_req_zone $binary_remote_addr zone=appeals_public:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=appeals_feed:10m rate=10r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # This port is bound to loopback and receives traffic from the host's reverse proxy.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 19m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Domain-restricted map keys need the origin; never send form paths or parameters.
    add_header Referrer-Policy strict-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net https://yandex.ru; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https://*.maps.yandex.net https://*.api-maps.yandex.ru https://api-maps.yandex.ru https://yandex.ru; media-src 'self' blob:; connect-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru; frame-src https://api-maps.yandex.ru; child-src https://api-maps.yandex.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /api/public/appeals/catalog {
        limit_req zone=appeals_public burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://appeals-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/public/appeals/capture-sessions {
        limit_req zone=appeals_public burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://appeals-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/public/appeals {
        limit_req zone=appeals_public burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://appeals-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /api/public/appeals/capture-sessions/resume {
        limit_req zone=appeals_public burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://appeals-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/public/appeals/wall {
        limit_req zone=appeals_feed burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://appeals-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/public/appeals/ {
        limit_req zone=appeals_public burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://appeals-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/ { return 404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location = /version.json { expires -1; try_files $uri =404; }
    location = / { expires -1; try_files /citizens.html =404; }
    location = /appeals { expires -1; try_files /citizens.html =404; }
    location = /appeals/ { expires -1; try_files /citizens.html =404; }
    location = /citizens.html { expires -1; }
    location / { try_files $uri =404; }
}
