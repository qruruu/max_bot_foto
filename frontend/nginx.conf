limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net https://yandex.ru; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: https://*.maps.yandex.net https://*.api-maps.yandex.ru https://api-maps.yandex.ru https://yandex.ru; connect-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru; frame-src https://api-maps.yandex.ru; child-src https://api-maps.yandex.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
