include /etc/nginx/snippets/nginx-security-http.conf;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=appeals_intake:10m rate=12r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Only the local reverse proxy can reach this loopback-bound service.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 2m;
    include /etc/nginx/snippets/nginx-security-locations.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net https://yandex.ru; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https://*.maps.yandex.net https://*.api-maps.yandex.ru https://api-maps.yandex.ru https://yandex.ru; media-src 'self' blob:; connect-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru; frame-src https://api-maps.yandex.ru; child-src https://api-maps.yandex.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/public/appeals {
        client_max_body_size 76m;
        limit_req zone=appeals_intake burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /api/public/appeals/capture-sessions {
        limit_req zone=appeals_intake burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/public/appeals/ {
        client_max_body_size 76m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location ~ "^/(org/[0-9a-f-]{36}/)?api/(platform/)?appeals/[0-9]+/(result|close)$" {
        client_max_body_size 76m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /appeals { expires -1; try_files /citizens.html =404; }
    location = /appeals/ { expires -1; try_files /citizens.html =404; }
    location ~ "^/a/[0-9]+(/card[.]jpg)?$" {
        limit_req zone=appeals_intake burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location = /api/platform/news/assets {
        client_max_body_size 8m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/avatar {
        client_max_body_size 5m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/inspection/avatar {
        client_max_body_size 5m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location ~ "^/api/inspection/organizations/[0-9a-f-]{36}/appeals$" {
        client_max_body_size 76m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location ~ "^/org/[0-9a-f-]{36}/api/auth/login$" {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location ~ "^/org/[0-9a-f-]{36}/api/" {
        client_max_body_size 5m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /version.json {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
