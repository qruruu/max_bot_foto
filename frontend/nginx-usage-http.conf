# Privacy-preserving page opens only; no client identifiers or raw request fields.
map $request_uri $metka_usage_page {
    default "";
    ~^/(?:\?.*)?$ home;
    ~^/(?:index|citizens)\.html(?:\?.*)?$ home;
    ~^/appeals/?(?:\?.*)?$ appeals;
    ~^/a/[0-9]+(?:\?.*)?$ appeal_card;
    "~^/(?:org/[0-9a-f-]{36}/)?(?:\?.*)?$" home;
    "~^/(?:org/[0-9a-f-]{36}/)?(?:photos|photo-map|review|days|daily-reports|spam|districts)(?:/[^?]*)?(?:\?.*)?$" workspace;
    "~^/(?:org/[0-9a-f-]{36}/)?(?:news|inspectors|messages|chats|work-types|users|audit|jobs|learning|exchange|settings|account)(?:/[^?]*)?(?:\?.*)?$" workspace;
}
map $http_sec_fetch_dest $metka_usage_document {
    default 0;
    document 1;
    "" $metka_usage_accept;
}
map $http_accept $metka_usage_accept { default 0; ~*text/html 1; }
map "$request_method:$status:$metka_usage_document:$metka_usage_page" $metka_usage_log {
    default 0;
    ~^GET:(?:200|304):1:.+ 1;
}
map $http_referer $metka_usage_source {
    default other;
    "" unspecified;
    ~*^https?://metka\.yunorit\.ru(?::[0-9]+)?(?:/|$) metka;
    ~*^https?://metka-signal\.yunorit\.ru(?::[0-9]+)?(?:/|$) signal;
    ~*^https?://(?:[^/.:]+\.)?(?:yandex\.(?:ru|com)|ya\.ru)(?::[0-9]+)?(?:/|$) yandex;
    ~*^https?://(?:[^/.:]+\.)?google\.(?:com|ru)(?::[0-9]+)?(?:/|$) google;
    ~*^https?://(?:[^/.:]+\.)?(?:vk\.com|vk\.ru)(?::[0-9]+)?(?:/|$) vk;
    ~*^https?://(?:t\.me|telegram\.org)(?::[0-9]+)?(?:/|$) telegram;
    ~*^https?://(?:[^/.:]+\.)?max\.ru(?::[0-9]+)?(?:/|$) max;
}
log_format metka_usage escape=json 'METKA_USAGE_V1 {"at":"$time_iso8601","page":"$metka_usage_page","source":"$metka_usage_source"}';
