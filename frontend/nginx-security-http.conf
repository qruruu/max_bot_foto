# Included in http context. Only the explicit service-file locations use this limit.
limit_req_zone $binary_remote_addr zone=service_probes:10m rate=6r/m;
map $uri $metka_probe_target {
    default other_dotfile;
    ~*(^|/)\.env env;
    ~*(^|/)\.git(?:/|$) git;
    ~*^/wp-admin(?:/|$) wordpress_admin;
    ~*^/wp-login\.php(?:/|$) wordpress_login;
    ~*^/phpmyadmin(?:/|$) phpmyadmin;
    ~*^/vendor/phpunit(?:/|$) phpunit;
}
# Fixed categories only: no URL, arguments, user agent, referrer or request body.
log_format metka_security escape=json 'METKA_SECURITY_V1 {"at":"$time_iso8601","ip":"$remote_addr","method":"$request_method","target":"$metka_probe_target","status":$status,"response_bytes":$body_bytes_sent,"limit":"$limit_req_status","policy":"service-files-v1"}';
