# Keep this before other regex locations so a secret file cannot reach SPA/API/static handlers.
# .well-known remains available for ACME; nested dotfiles inside it are still denied.
location ~* "(^|/)\.(?!well-known(?:/|$))|^/(?:wp-admin(?:/|$)|wp-login\.php(?:/|$)|phpmyadmin(?:/|$)|vendor/phpunit(?:/|$))" {
    limit_req zone=service_probes burst=5 nodelay;
    limit_req_status 429;
    # Access phase follows limit_req. A rewrite-phase return would bypass the limiter.
    deny all;
    access_log /dev/stdout metka_security;
    # Nginx's denial/limiter error messages contain the raw URI. Keep it out of Docker logs.
    error_log /dev/null crit;
}
